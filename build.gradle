plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}
tasks.named('processResources') {
    from('src/main/icon.png')
}

repositories.clear()
repositories {
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://neoforged.forgecdn.net/releases" }
    maven { url = "https://neoforged.forgecdn.net/mojang-meta" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content { includeGroup "com.github.rtyley" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.ryanhcode.dev/releases" } }
        filter { includeGroup "dev.ryanhcode.sable-companion" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://www.cursemaven.com"
            }
        }
        filter { includeGroup "curse.maven" }
    }
    // FTB Quests / FTB Library / FTB Teams (FTB maven).
    maven { url = "https://maven.ftb.dev/releases" }
    // Architectury API, required by the FTB mods.
    maven { url = "https://maven.architectury.dev/" }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create: Biotech 2.0.0-beta.3, NeoForge 1.21.1; development runtime only.
    localRuntime "maven.modrinth:UW0IjVT0:exGZMIgK"



    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Optional Kaleidoscope Cookery compatibility; local jar is only required for development builds.
    compileOnly files('libs/kaleidoscopecookery-1.6.0-neoforge+mc1.21.1.jar')
    localRuntime files('libs/kaleidoscopecookery-1.6.0-neoforge+mc1.21.1.jar')

    // Biotech 2.0.0-beta.3 requires build.381 or newer when KubeJS is installed.
    api "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381"

    // 可选：用于接口注入数据
    interfaceInjectionData "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381"

    constraints {
        runtimeOnly('dev.latvian.mods:better-advanced-tooltips:2101.1.0-build.6') {
            version { strictly '2101.1.0-build.6' }
            because 'Keep KubeJS runtime dependencies on Minecraft 1.21.1 and Java 21.'
        }
    }

    implementation "maven.modrinth:T38eAZQC:1qmcLagN"

    // Optional Create addon integrations for NeoForge 1.21.1.
    // compileOnly exposes their APIs while localRuntime loads them only in the development environment.
    compileOnly "maven.modrinth:kU1G12Nn:vD7sHwsm" // Create: Crafts & Additions 1.7.1 (NeoForge 1.21.1, beta)
    localRuntime "maven.modrinth:kU1G12Nn:vD7sHwsm"

    // Create: Aeronautics 1.3.2 development runtime. The bundled artifact contains
    // Aeronautics, Simulated, and Offroad; Sable is its required standalone dependency.
    // localRuntime keeps both mods out of our published artifact.
    localRuntime "maven.modrinth:oWaK0Q19:${aeronautics_version}"
    localRuntime "maven.modrinth:T9PomCSv:${sable_version}"
    // Optional collision bridge: compile against the installed API, never bundle/require Sable.
    compileOnly "maven.modrinth:T9PomCSv:${sable_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0"

    compileOnly "maven.modrinth:ZM3tt6p1:UoPH8lO1" // Create: Diesel Generators 1.3.15 (NeoForge 1.21.1)
    localRuntime "maven.modrinth:ZM3tt6p1:UoPH8lO1"

    // Create: Connected 1.3.3 for NeoForge 1.21.1 / Create 6.0.10.
    // compileOnly exposes its optional API; localRuntime is development-only.
    compileOnly "maven.modrinth:create-connected:${create_connected_version}"
    localRuntime "maven.modrinth:create-connected:${create_connected_version}"

    // Create Stuff 'N Additions 2.1.4.b for NeoForge 1.21.1.
    // compileOnly exposes its optional API; localRuntime is development-only.
    compileOnly "maven.modrinth:create-stuff-additions:${create_stuff_additions_version}"
    localRuntime "maven.modrinth:create-stuff-additions:${create_stuff_additions_version}"

    compileOnly "maven.modrinth:nvQzSEkH:eYz2YBGT" // Jade 15.10.6 (NeoForge 1.21.1)
    localRuntime "maven.modrinth:nvQzSEkH:eYz2YBGT"

    // Ponderer is an in-game Ponder authoring tool. Keep it development-only so it
    // is available in runClient without becoming a runtime dependency of this mod.
    localRuntime "maven.modrinth:the-ponderer:${ponderer_version}"

    // Botany Pots development runtime. Its optional integration is data-driven, so the
    // main API and required Bookshelf/Prickle dependencies are exposed at compile time
    // but are never bundled into the published mod.
    compileOnly files("libs/botanypots-neoforge-${minecraft_version}-${botanypots_version}.jar")
    compileOnly files("libs/bookshelf-neoforge-${minecraft_version}-${bookshelf_version}.jar")
    compileOnly files("libs/prickle-neoforge-${minecraft_version}-${prickle_version}.jar")
    localRuntime files("libs/botanypots-neoforge-${minecraft_version}-${botanypots_version}.jar")
    localRuntime files("libs/bookshelf-neoforge-${minecraft_version}-${bookshelf_version}.jar")
    localRuntime files("libs/prickle-neoforge-${minecraft_version}-${prickle_version}.jar")
    // Farmer's Delight 1.21.1 NeoForge development runtime.
    localRuntime "maven.modrinth:farmers-delight:1.21.1-1.2.8"

    // Optional LaoWu cat litter archaeology compatibility, development runtime only.
    localRuntime "curse.maven:create-meowchanics-1645794:9163509"


    // PoopSky (空中厕所) 2.2+NeoForge1.21.1-Hotfix2, development runtime only.
    localRuntime "maven.modrinth:poopsky:CEa86OFf"

    // Mob Battle Mod (生物大乱斗) 1.21.1-2.8.1 NeoForge, development runtime only.
    localRuntime "maven.modrinth:LbrJcAlI:LYSelox1"

    // FTB Quests (NeoForge 1.21.1) and its dependencies.
    // compileOnly exposes the quest API for optional integration code; localRuntime only loads
    // these mods in the development environment, so production never gains a hard dependency.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    localRuntime "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"



    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}



